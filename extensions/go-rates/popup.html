<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JourneyPerfect Go Rates</title>
  <style>
    :root { color-scheme: light dark; --fg: #111827; --muted: #6b7280; --bg: #ffffff; --line: #e5e7eb; --accent: #1d4ed8; --bad: #b42318; --ok: #067647; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --muted: #9ca3af; --bg: #111827; --line: #374151; --accent: #60a5fa; --bad: #f97066; --ok: #47cd89; } }
    body { margin: 0; padding: 12px; width: 320px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
    body.tab { width: auto; max-width: 560px; margin: 24px auto; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0; text-align: center; }
    .counts div { border: 1px solid var(--line); border-radius: 6px; padding: 4px 0; }
    .counts b { display: block; font-size: 16px; }
    .bad { color: var(--bad); }
    .ok { color: var(--ok); }
    button { width: 100%; margin-top: 6px; padding: 7px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 220px; overflow: auto; }
    li { padding: 3px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
    #msg { min-height: 1.4em; margin-top: 8px; word-break: break-word; }
    textarea { width: 100%; height: 120px; margin-top: 6px; font: 11px ui-monospace, monospace; box-sizing: border-box; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>JourneyPerfect Go Rates</h1>
  <div id="none" class="muted">No run in progress. Start one from an Opportunities search on JourneyPerfect ("Open Go rate tabs").</div>
  <div id="run" class="hidden">
    <div>Search <code id="sid"></code> <span id="status" class="muted"></span></div>
    <div class="counts">
      <div><b id="opened">0</b><span class="muted">opened</span></div>
      <div><b id="captured" class="ok">0</b><span class="muted">captured</span></div>
      <div><b id="failed" class="bad">0</b><span class="muted">failed</span></div>
      <div><b id="total">0</b><span class="muted">total</span></div>
    </div>
    <div id="err" class="bad"></div>
    <ul id="items"></ul>
  </div>
  <div id="tabNote" class="muted hidden">This window holds the Hilton and Marriott tabs for the current run. Closing it stops the run.</div>
  <button id="capture" class="primary">Capture this tab</button>
  <button id="stop">Stop</button>
  <button id="snapshot">Debug: copy page snapshot</button>
  <div id="msg" class="muted"></div>
  <textarea id="snapOut" class="hidden" readonly></textarea>
  <script src="popup.js"></script>
</body>
</html>
